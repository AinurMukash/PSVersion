name: Keepalive

on:
  schedule:
    # Run every 50 days to prevent GitHub from disabling scheduled workflows
    - cron: "0 8 */50 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep workflows alive
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync.yml'
            });
            console.log('sync.yml workflow re-enabled successfully');
