name: Sync Enbek Professional Standards

on:
  schedule:
    # Run every Monday at 08:00 UTC (13:00 Asia/Almaty)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional limit for number of standards to process"
        required: false
        default: ""
      bootstrap:
        description: "Run as baseline bootstrap (no diff events)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Enbek synchronization
        run: |
          ARGS="sync"
          if [ "${{ github.event.inputs.bootstrap }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            ARGS="$ARGS --bootstrap"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python -m enbek_monitor.cli $ARGS

      - name: Notify subscribers about registry changes
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.bootstrap != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git status --porcelain -- history/changes.jsonl | grep -q .; then
            echo "No lifecycle events to notify about."
            exit 0
          fi

          tail -n 50 history/changes.jsonl > /tmp/enbek-changes.diff
          RUN_DATE=$(date -u +"%Y-%m-%d")
          gh issue create \
            --title "Обновление реестра профессиональных стандартов: ${RUN_DATE}" \
            --body-file /tmp/enbek-changes.diff

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected on Enbek.kz. Repository is up to date."
            exit 0
          fi

          COMMIT_DATE=$(date -u +"%Y-%m-%d")
          git commit -m "sync: weekly Enbek update ${COMMIT_DATE} [skip ci]"
          git push
