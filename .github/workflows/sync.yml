name: Sync Enbek Professional Standards

on:
  schedule:
    # Run every Monday at 08:00 UTC (13:00 Asia/Almaty)
    - cron: "0 8 * * 1"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/sync.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional limit for number of standards to process"
        required: false
        default: ""
      bootstrap:
        description: "Run as baseline bootstrap (no diff events)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Enbek synchronization
        run: |
          ARGS="sync"
          if [ "${{ github.event.inputs.bootstrap }}" = "true" ]; then
            ARGS="$ARGS --bootstrap"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          python -m enbek_monitor.cli $ARGS

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected on Enbek.kz. Repository is up to date."
            exit 0
          fi

          COMMIT_DATE=$(date -u +"%Y-%m-%d")
          git commit -m "sync: weekly Enbek update ${COMMIT_DATE} [skip ci]"
          git push

      - name: Notify subscribers about registry changes
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.bootstrap != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m enbek_monitor.cli issue-summary --output /tmp/enbek-changes.md
          RUN_ID=$(sed -n 's/.*<!-- enbek-run-id:\([^ ]*\) -->.*/\1/p' /tmp/enbek-changes.md | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "No lifecycle events to notify about."
            exit 0
          fi

          RUN_DATE=${RUN_ID#run-}
          EXISTING_ISSUE=$(gh issue list --state all --limit 100 --search "$RUN_ID in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue edit "$EXISTING_ISSUE" --body-file /tmp/enbek-changes.md
            echo "Updated notification issue #$EXISTING_ISSUE for $RUN_ID."
          else
            gh issue create \
              --title "Обновление реестра профессиональных стандартов: ${RUN_DATE} (${RUN_ID})" \
              --body-file /tmp/enbek-changes.md
          fi

      - name: Create or update full standards catalog issue
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.bootstrap != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m enbek_monitor.cli issue-summary --output /tmp/enbek-changes.md
          RUN_ID=$(sed -n 's/.*<!-- enbek-run-id:\([^ ]*\) -->.*/\1/p' /tmp/enbek-changes.md | head -n 1)
          if [ -z "$RUN_ID" ]; then
            echo "No run ID found; skipping catalog issue."
            exit 0
          fi

          RUN_DATE=${RUN_ID#run-}
          python -m enbek_monitor.cli catalog-issue --output /tmp/enbek-catalog.md

          CATALOG_TITLE="Каталог профессиональных стандартов: ${RUN_DATE} (${RUN_ID})"
          EXISTING_CATALOG=$(gh issue list --state all --limit 100 --search "Каталог $RUN_ID in:title" \
            --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_CATALOG" ]; then
            gh issue edit "$EXISTING_CATALOG" --body-file /tmp/enbek-catalog.md
            echo "Updated catalog issue #$EXISTING_CATALOG for $RUN_ID."
          else
            NEW_CATALOG=$(gh issue create \
              --title "$CATALOG_TITLE" \
              --body-file /tmp/enbek-catalog.md \
              --label "catalog" \
              --json number --jq '.number')
            echo "Created catalog issue #$NEW_CATALOG for $RUN_ID."

            for PART_FILE in /tmp/enbek-catalog-part-*.md; do
              if [ -f "$PART_FILE" ]; then
                gh issue comment "$NEW_CATALOG" --body-file "$PART_FILE"
                echo "Added catalog comment from $PART_FILE to issue #$NEW_CATALOG."
              fi
            done
          fi
