name: Weekly hh Vacancy Snapshot

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      query:
        description: "Vacancy search query"
        required: false
        default: "тестировщик ПО"
      area:
        description: "Optional hh area ID (40 = Kazakhstan)"
        required: false
        default: "40"
      limit:
        description: "Maximum vacancies"
        required: false
        default: "100"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Collect hh vacancies
        env:
          QUERY: ${{ github.event.inputs.query || 'тестировщик ПО' }}
          AREA: ${{ github.event.inputs.area || '40' }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: |
          if [ -n "$AREA" ]; then
            python -m enbek_monitor.cli vacancies-sync --query "$QUERY" --area "$AREA" --limit "$LIMIT"
          else
            python -m enbek_monitor.cli vacancies-sync --query "$QUERY" --limit "$LIMIT"
          fi
      - name: Commit weekly snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vacancies raw/hh raw/manifest.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "sync: weekly hh vacancy snapshot [skip ci]"
          git push